name: Release

on:
  push:
    tags:
      - "v*"

# Publishes canvit-pytorch to PyPI (trusted publishing) when a v* tag is pushed.
# The PyPI trusted-publisher entry must name m2b3/CanViT and this workflow file.
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvit-pytorch
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - name: The wheel carries the license text
        run: unzip -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'

      - run: uv publish
