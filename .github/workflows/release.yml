name: Release

on:
  push:
    tags:
      - "canvit-v*"
      - "canvit-*-v*"

# Register this workflow as a trusted publisher for each PyPI project.
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Select and verify package
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RELEASE_TAG%-v*}"
          expected_version="${RELEASE_TAG##*-v}"

          package_version="$(uv run --no-project python -c \
            'import pathlib, sys, tomllib; path = pathlib.Path(sys.argv[1]); project = tomllib.loads((path / "pyproject.toml").read_text())["project"]; assert project["name"] == path.name; print(project["version"])' \
            "$package_dir")"
          if [[ "$package_version" != "$expected_version" ]]; then
            printf 'tag %s names version %s, but %s declares %s\n' \
              "$RELEASE_TAG" "$expected_version" "$package_dir" "$package_version" >&2
            exit 1
          fi
          printf 'package_dir=%s\n' "$package_dir" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build "${{ steps.package.outputs.package_dir }}" --out-dir dist

      - name: Check wheel license
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          unzip -p "${wheels[0]}" '*dist-info/licenses/LICENSE' > /tmp/canvit-wheel-license.txt
          test -s /tmp/canvit-wheel-license.txt

      - name: Publish package
        run: uv publish dist/*
