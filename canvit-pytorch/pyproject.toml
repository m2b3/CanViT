[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvit_pytorch"]

[tool.hatch.build.targets.sdist]
exclude = ["*.pt", "*.pt.bak", "*.pth", "throwaway/", "test_data/", "slurm/", "scripts/", "bench/", "tpu/"]

[project]
name = "canvit-pytorch"
# 0.1.10 is the last PyPI release; this development version adds the
# pretrain, specialize and evaluate subpackages.
version = "0.2.0.dev0"
description = "CanViT (Canvas Vision Transformer): model, pretraining, task specialization and evaluation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yohaï-Eliel Berreby", email = "me@yberreby.com" },
    { name = "Sabrina Du", email = "sabrina.du@mail.mcgill.ca" }
]
requires-python = ">=3.12"
keywords = ["vision-transformer", "active-vision", "pytorch", "foundation-model", "canvit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Minimum versions declared here are the lowest verified to work; the lock
# resolves the newest each platform offers. On macOS, MPS inference was
# verified on torch 2.14.
dependencies = [
    "huggingface-hub>=1.3.2",
    "numpy>=2.2.0,<2.4.0",
    "torch>=2.9.0",
    "torch>=2.14.0; sys_platform == 'darwin'",
    "torchvision>=0.22.0",
    "safetensors>=0.7.0",
]

[project.urls]
Repository = "https://github.com/m2b3/CanViT"
Homepage = "https://m2b3.github.io/CanViT/"
Paper = "https://arxiv.org/abs/2603.22570"
Checkpoints = "https://huggingface.co/canvit"

[project.optional-dependencies]
demo = [
    "scikit-learn>=1.7.0",
    "dinov3-in1k-probes",
    "matplotlib>=3.10.8",
    "timm>=1.0.0",
    "transformers>=4.50.0",
    "tyro>=1.0.3",
]
pretrain = [
    "torch>=2.10",
    "dinov3",
    "dinov3-in1k-probes",
    "transformers>=4.50.0",
    "comet-ml",
    "tyro",
    "tqdm",
    "rich",
    "omegaconf",
    "dacite",
    "optuna",
    "pyarrow",
    "polars",
    "torchmetrics",
    "matplotlib",
    "xxhash",
    "opencv-python-headless>=4.13.0.90",
]
specialize = [
    "dinov3",
    "pillow>=10.0.0",
    "timm>=1.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "comet-ml>=3.30.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "transformers>=4.50.0",
]
evaluate = [
    "canvit-pytorch[specialize]",
    "pillow>=10.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "transformers>=4.50.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37.2",
    "ipython>=9.8.0",
    "pypatree>=0.4.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "matplotlib>=3.10.8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
dinov3 = { git = "https://github.com/facebookresearch/dinov3.git", rev = "54694f7627fd815f62a5dcc82944ffa6153bbb76" }
dinov3-in1k-probes = { git = "https://github.com/m2b3/dinov3-in1k-probes.git" }
# Linux GPU hosts take CUDA 12.8 wheels (crockett's driver predates CUDA 13);
# macOS takes PyPI wheels (MPS).
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["canvit_pytorch", "tests"]
python_files = ["test.py", "test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "network: marks tests that require network access (HF Hub downloads, etc.)",
]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:Failed to initialize NumPy:UserWarning"]

[tool.ruff]
line-length = 120
exclude = ["throwaway", "misc"]

[tool.ruff.lint]
# Pinned to the rule set every package passed before the merge. Ruff 0.16
# widened its defaults; adopting those rules is a separate cleanup.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Sets torch._functorch.config before imports (required).
"canvit_pytorch/pretrain/train/loop.py" = ["E402"]
# Logger setup and heavy imports are interleaved so TPU cold-start import time is logged.
"canvit_pytorch/specialize/training/gcp_in1k_clf_ft/shared.py" = ["E402"]
"canvit_pytorch/specialize/training/gcp_in1k_clf_ft/train_imagenet.py" = ["E402"]

[tool.basedpyright]
typeCheckingMode = "standard"
