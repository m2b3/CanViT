[project]
name = "canvit-mlx"
version = "0.2.0"
description = "CanViT (Canvas Vision Transformer) for MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yohaï-Eliel Berreby", email = "me@yberreby.com" }
]
requires-python = ">=3.12"

dependencies = [
    "canvit-core>=0.2.1,<0.3.0",
    "mlx>=0.32.3",
    "numpy>=2.2",
    "safetensors>=0.8.0",
]

[project.urls]
Repository = "https://github.com/m2b3/CanViT"
Homepage = "https://m2b3.github.io/CanViT/"
Paper = "https://arxiv.org/abs/2603.22570"
Checkpoints = "https://huggingface.co/canvit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvit_mlx"]

[tool.hatch.build.hooks.custom]
path = "license_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["license_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../tools/license_build.py" = "license_build.py"

[tool.uv.sources]
canvit-core = { path = "../canvit-core", editable = true }
canvit-pytorch = { path = "../canvit-pytorch", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "canvit-pytorch",
    "pypatree>=0.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "rust-just>=1.58.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "ISC", "PLW1510", "RUF100"]

[tool.basedpyright]
typeCheckingMode = "standard"
