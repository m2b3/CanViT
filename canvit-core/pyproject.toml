[project]
name = "canvit-core"
version = "0.2.1"
description = "Shared architecture definitions for CanViT (Canvas Vision Transformer)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yohaï-Eliel Berreby", email = "me@yberreby.com" }
]
requires-python = ">=3.12"

dependencies = [
    "huggingface-hub>=1.3.2",
    "numpy>=2.2",
    "pillow>=12.3.0",
]

[project.urls]
Repository = "https://github.com/m2b3/CanViT"
Homepage = "https://m2b3.github.io/CanViT/"
Paper = "https://arxiv.org/abs/2603.22570"
Checkpoints = "https://huggingface.co/canvit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvit_core"]

[tool.hatch.build.hooks.custom]
path = "license_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["license_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../tools/license_build.py" = "license_build.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "ISC", "PLW1510", "RUF100"]

[tool.basedpyright]
typeCheckingMode = "standard"
