[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvit_pytorch"]

[tool.hatch.build.targets.sdist]
exclude = ["*.pt", "*.pt.bak", "*.pth", "test_data/", "slurm/", "tpu/"]

# The license text is the repository's LICENSE; the sdist carries a copy, from which the wheel takes it.
[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"

[project]
name = "canvit-pytorch"
# 0.1.10 is the last PyPI release; this development version adds the
# pretrain, specialize and evaluate subpackages.
version = "0.2.0"
description = "CanViT (Canvas Vision Transformer): model, pretraining, task specialization and evaluation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yohaï-Eliel Berreby", email = "me@yberreby.com" },
    { name = "Sabrina Du", email = "sabrina.du@mail.mcgill.ca" }
]
requires-python = ">=3.12"
keywords = ["vision-transformer", "active-vision", "pytorch", "foundation-model", "canvit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Minimum versions declared here are the lowest verified to work; the lock
# resolves the newest each platform offers. On macOS, MPS inference was
# verified on torch 2.14.
dependencies = [
    "huggingface-hub>=1.3.2",
    "numpy>=2.2.0,<2.4.0",
    "torch>=2.9.0",
    "torch>=2.14.0; sys_platform == 'darwin'",
    "torchvision>=0.22.0",
    "safetensors>=0.7.0",
]

[project.urls]
Repository = "https://github.com/m2b3/CanViT"
Homepage = "https://m2b3.github.io/CanViT/"
Paper = "https://arxiv.org/abs/2603.22570"
Checkpoints = "https://huggingface.co/canvit"

[project.optional-dependencies]
demo = [
    "matplotlib>=3.10.8",
    "pillow>=10.0.0",
    "tyro>=1.0.3",
]
pretrain = [
    "torch>=2.10",
    "transformers>=4.50.0",
    "comet-ml",
    "tyro",
    "pyarrow",
    "matplotlib",
    "xxhash",
]
specialize = [
    "dinov3",
    "pillow>=10.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "comet-ml>=3.30.0",
    "matplotlib>=3.8.0",
    "transformers>=4.50.0",
]
viz = [
    "pillow>=10.0.0",
    "tyro>=1.0.0",
]
evaluate = [
    "pillow>=10.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "transformers>=4.50.0",
    "pandas>=2.0.0",
    "pyarrow>=20.0.0",
]
live = [
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pillow>=10.0.0",
    "playwright>=1.63.0",
    "tyro>=1.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37.2",
    "ipython>=9.8.0",
    "pypatree>=0.4.0",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "scikit-learn>=1.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
dinov3 = { git = "https://github.com/facebookresearch/dinov3.git", rev = "54694f7627fd815f62a5dcc82944ffa6153bbb76" }
# Linux GPU hosts take CUDA 12.8 wheels (crockett's driver predates CUDA 13);
# macOS takes PyPI wheels (MPS).
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["canvit_pytorch", "tests"]
python_files = ["test.py", "test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "network: marks tests that require network access (HF Hub downloads, etc.)",
]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:Failed to initialize NumPy:UserWarning"]

[tool.ruff]
line-length = 120
exclude = ["throwaway", "misc"]

[tool.ruff.lint]
# Errors and pyflakes, plus rules that guard real properties: sorted imports,
# no blind `except Exception` without a stated reason, no implicit string
# concatenation (a missing comma), explicit `check` on subprocess.run, no
# stale noqa. Ruff 0.16's other default rules flag deliberate code here.
select = ["E4", "E7", "E9", "F", "I", "BLE", "ISC", "PLW1510", "RUF100"]

[tool.basedpyright]
typeCheckingMode = "standard"
