[project]
name = "gfnet-adaptivenn"
version = "0.1.0"
description = "GFNet's and AdaptiveNN's released ImageNet-1k models, measured with their own code for the CanViT paper"
readme = "README.md"
license = "MIT"
# GFNet's code was last measured under Python 3.12.
requires-python = "==3.12.*"
# Not published: PyPI refuses any upload that carries this classifier.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "gdown>=5.2",
    "numpy>=2.2",
    # AdaptiveNN's requirements.txt, beside torch and torchvision.
    "six>=1.17",
    "tensorboardx>=2.6",
    "torch>=2.11",
    "torchvision>=0.26",
    "tyro>=1.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gfnet_adaptivenn"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Linux GPU hosts take CUDA 12.8 wheels; macOS takes PyPI's.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "rust-just>=1.58.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "ISC", "PLW1510", "RUF100"]

[tool.basedpyright]
typeCheckingMode = "standard"
