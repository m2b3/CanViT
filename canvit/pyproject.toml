[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "license_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["license_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../tools/license_build.py" = "license_build.py"

[project]
name = "canvit"
version = "0.0.2"
description = "CanViT (Canvas Vision Transformer) package entry point"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yohaï-Eliel Berreby", email = "me@yberreby.com" }]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://m2b3.github.io/CanViT/"
Repository = "https://github.com/m2b3/CanViT"
