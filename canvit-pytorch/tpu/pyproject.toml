# Environment for ImageNet-1k fine-tuning on Cloud TPU
# (canvit_pytorch/specialize/in1k_tpu/). Kept apart from the
# main project because torch_xla 2.9.0's ABI pins torch and torchvision exactly;
# these are the pins that produced the paper's 84.5% fine-tuned checkpoint.
#
# The dependencies mirror canvit-pytorch's base dependencies plus its
# `specialize` extra (../pyproject.toml), minus torch and torchvision; keep them
# in step. canvit-pytorch itself is installed into this environment without
# dependencies by in1k_tpu/setup_tpu.sh, because uv would otherwise
# apply the main project's CUDA wheel index to torch.

[project]
name = "canvit-pytorch-tpu-env"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.0+cpu",
    "torchvision==0.24.0+cpu",
    "torch_xla[tpu]==2.9.0",
    "tfrecord",
    "huggingface-hub>=1.3.2",
    "numpy>=2.2.0,<2.4.0",
    "safetensors>=0.7.0",
    "dinov3",
    "pillow>=10.0.0",
    "timm>=1.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "comet-ml>=3.30.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "transformers>=4.50.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
dinov3 = { git = "https://github.com/facebookresearch/dinov3.git", rev = "54694f7627fd815f62a5dcc82944ffa6153bbb76" }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
