# Environment for ImageNet-1k fine-tuning on Cloud TPU
# (canvit_pytorch/specialize/in1k_tpu/). Kept apart from the
# main project because torch_xla 2.9.0's ABI pins torch and torchvision exactly;
# these are the pins that produced the paper's 84.5% fine-tuned checkpoint.
#
# The dependencies are what canvit_pytorch.specialize.in1k_tpu imports.
# canvit-pytorch itself is installed into this environment without
# dependencies by in1k_tpu/setup_tpu.sh, because uv would otherwise
# apply the main project's CUDA wheel index to torch.

[project]
name = "canvit-pytorch-tpu-env"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.0+cpu",
    "torchvision==0.24.0+cpu",
    "torch_xla[tpu]==2.9.0",
    "tfrecord",
    "huggingface-hub>=1.3.2",
    "numpy>=2.2.0,<2.4.0",
    "safetensors>=0.7.0",
    "pillow>=10.0.0",
    "tyro>=1.0.0",
    "comet-ml>=3.30.0",
    "matplotlib>=3.8.0",
    "canvit-core>=0.2.1,<0.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
canvit-core = { path = "../../canvit-core", editable = true }
